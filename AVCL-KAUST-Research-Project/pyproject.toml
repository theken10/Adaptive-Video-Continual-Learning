[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avcl-research"
version = "1.0.0"
description = "Adaptive memory-efficient video continual learning research prototype"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
avcl-run = "avcl.cli:run_main"
avcl-validate = "avcl.cli:validate_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
